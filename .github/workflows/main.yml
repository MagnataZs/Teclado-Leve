
name: Build debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q TecladoLeve-fork*.zip
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: HeliBoard-main
      - uses: actions/upload-artifact@v4
        with:
          name: TecladoLeve-debug
          path: HeliBoard-main/app/build/outputs/apk/debug/*-debug*.apk
